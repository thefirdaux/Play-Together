<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Play Together — Host Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --color-bg: #E7E7E7;
    --color-surface: #FFFFFF;
    --color-ink: #171717;
    --color-ink-soft: #6B6B6B;
    --color-placeholder: #A3A3A3;
    --color-border: #E5E5E5;
    --color-primary: #153320;
    --color-accent: #D6E84B;
    --color-accent-soft: #C9D8B8;

    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 20px;
    --space-6: 24px;
    --space-7: 28px;
    --space-8: 32px;

    --radius-sm: 10px;
    --radius-md: 16px;
    --radius-lg: 20px;
    --radius-pill: 999px;

    --font-sf: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;

    --fs-h1: 30px;
    --fs-h2: 15px;
    --fs-body: 15px;
    --fs-small: 13px;
    --fs-caption: 12px;

    --frame-min: 393px;
    --frame-max: 700px;

    --shadow-card: 0 1px 2px rgba(0,0,0,0.04);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    background: var(--color-bg);
    font-family: var(--font-body);
    color: var(--color-ink);
    -webkit-text-size-adjust: 100%;
    overflow-x: hidden;
    touch-action: pan-y;
  }

  body{
    display: flex;
    justify-content: center;
    min-width: var(--frame-min);
  }

  .frame{
    width: 100%;
    min-width: var(--frame-min);
    max-width: var(--frame-max);
    background: var(--color-bg);
    position: relative;
    min-height: 100vh;
    padding-bottom: var(--space-8);
  }

  .header{
    display: flex;
    align-items: center;
    gap: var(--space-3);
    padding: var(--space-8) var(--space-5) var(--space-2);
  }

  .logo-badge{
    width: 40px;
    height: 40px;
    border-radius: 6.4px;
    background: #E4FF3A;
    border: 0.4px solid #000000;
    color: #143622;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', var(--font-display);
    font-weight: 700;
    font-size: 25.6px;
    line-height: normal;
    flex-shrink: 0;
  }

  .brand-name{
    font-weight: 800;
    font-size: 18px;
    text-align: left;
    font-family: var(--font-display);
  }

  .hero{
    padding: var(--space-4) var(--space-5) 0;
  }

  .hero h1{
    font-family: var(--font-sf);
    font-weight: 700;
    font-size: 28px;
    line-height: 34px;
    letter-spacing: 0.38px;
    margin: 0;
  }

  .hero p{
    margin: var(--space-3) 0 0;
    font-size: var(--fs-small);
    line-height: 1.55;
    color: var(--color-ink-soft);
  }

  .section{
    padding: var(--space-7) var(--space-5) 0;
  }

  .card{
    background: var(--color-surface);
    border-radius: 8px;
    box-shadow: var(--shadow-card);
    padding: 0;
  }

  .field-group > *:not(:last-child){
    border-bottom: 1px solid var(--color-border);
  }

  .field-group > *:first-child{
    border-top-left-radius: 8px;
    border-top-right-radius: 8px;
  }

  .field-group > *:last-child{
    border-bottom-left-radius: 8px;
    border-bottom-right-radius: 8px;
  }

  .field{
    width: 100%;
    border: none;
    background: transparent;
    outline: none;
    font-family: var(--font-body);
    font-size: max(16px, var(--fs-body));
    color: var(--color-ink);
    padding: var(--space-4);
  }

  .field::placeholder{
    color: var(--color-placeholder);
  }

  .field.is-invalid::placeholder{
    color: #C0392B;
  }

  .form-error{
    margin: var(--space-3) 0 0;
    padding: 0 var(--space-1);
    font-size: var(--fs-caption);
    color: #C0392B;
    display: none;
  }

  .form-error.visible{ display: block; }

  .primary-btn{
    width: 100%;
    margin-top: var(--space-4);
    padding: var(--space-4);
    border: none;
    border-radius: var(--radius-md);
    background: var(--color-primary);
    color: var(--color-accent);
    font-family: var(--font-display);
    font-size: var(--fs-body);
    font-weight: 700;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .primary-btn:active{ opacity: 0.9; }

  .primary-btn:disabled{
    opacity: 0.6;
    cursor: default;
  }

  .link-btn{
    width: 100%;
    margin-top: var(--space-3);
    padding: var(--space-3);
    border: none;
    background: none;
    color: var(--color-ink-soft);
    font-family: var(--font-body);
    font-size: var(--fs-small);
    text-align: center;
    cursor: pointer;
  }

  .link-btn strong{ color: var(--color-ink); font-weight: 700; }

  .status-note{
    margin: var(--space-4) 0 0;
    padding: 0 var(--space-1);
    font-size: var(--fs-caption);
    color: var(--color-ink-soft);
    text-align: center;
  }

  button, .field{ min-height: 44px; }

  @media (min-width: 701px){
    body{ background: var(--color-bg); }
  }
</style>
</head>
<body>

<div class="frame">

  <header class="header">
    <div class="logo-badge">Pt</div>
    <span class="brand-name">Play Together</span>
  </header>

  <section class="hero">
    <h1 id="page-heading">Host log in</h1>
    <p id="page-subheading">Log in to create games and manage your groups.</p>
  </section>

  <section class="section">
    <div class="card field-group">
      <input class="field" type="email" id="email-input" placeholder="Email" autocomplete="email" />
      <input class="field" type="password" id="password-input" placeholder="Password" autocomplete="current-password" />
    </div>
    <p class="form-error" id="form-error"></p>
    <p class="status-note" id="status-note"></p>

    <button class="primary-btn" id="submit-btn" type="button">Log in</button>
    <button class="link-btn" id="toggle-mode-btn" type="button">
      New host? <strong>Create an account</strong>
    </button>
  </section>

</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  // TODO: replace with your project's values — Supabase dashboard →
  // Project Settings → API.
  const SUPABASE_URL = 'https://egippcpanjtvpfkxefhy.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_cRGn5ZoheUHN3ZpqJ1e6dg_frds_duF';

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var headingEl = document.getElementById('page-heading');
  var subheadingEl = document.getElementById('page-subheading');
  var emailEl = document.getElementById('email-input');
  var passwordEl = document.getElementById('password-input');
  var errorEl = document.getElementById('form-error');
  var statusEl = document.getElementById('status-note');
  var submitBtn = document.getElementById('submit-btn');
  var toggleModeBtn = document.getElementById('toggle-mode-btn');

  // If already logged in, skip straight to the dashboard.
  supabase.auth.getSession().then(function(result){
    if (result.data.session){
      window.location.href = 'dashboard.html';
    }
  });

  var mode = 'login'; // 'login' | 'signup'

  function setMode(next){
    mode = next;
    emailEl.classList.remove('is-invalid');
    passwordEl.classList.remove('is-invalid');
    errorEl.classList.remove('visible');
    statusEl.textContent = '';

    if (mode === 'signup'){
      headingEl.textContent = 'Create a host account';
      subheadingEl.textContent = 'Sign up to start creating and sharing games.';
      submitBtn.textContent = 'Sign up';
      toggleModeBtn.innerHTML = 'Already have an account? <strong>Log in</strong>';
    } else {
      headingEl.textContent = 'Host log in';
      subheadingEl.textContent = 'Log in to create games and manage your groups.';
      submitBtn.textContent = 'Log in';
      toggleModeBtn.innerHTML = 'New host? <strong>Create an account</strong>';
    }
  }

  toggleModeBtn.addEventListener('click', function(){
    setMode(mode === 'login' ? 'signup' : 'login');
  });

  function showError(message){
    errorEl.textContent = message;
    errorEl.classList.add('visible');
  }

  submitBtn.addEventListener('click', function(){
    var email = emailEl.value.trim();
    var password = passwordEl.value;

    emailEl.classList.remove('is-invalid');
    passwordEl.classList.remove('is-invalid');
    errorEl.classList.remove('visible');
    statusEl.textContent = '';

    if (!email){
      emailEl.classList.add('is-invalid');
      showError('Please enter your email.');
      return;
    }
    if (!password){
      passwordEl.classList.add('is-invalid');
      showError('Please enter your password.');
      return;
    }

    submitBtn.disabled = true;
    statusEl.textContent = mode === 'signup' ? 'Creating your account…' : 'Logging in…';

    var authCall = mode === 'signup'
      ? supabase.auth.signUp({ email: email, password: password })
      : supabase.auth.signInWithPassword({ email: email, password: password });

    authCall.then(function(result){
      submitBtn.disabled = false;

      if (result.error){
        statusEl.textContent = '';
        showError(result.error.message);
        return;
      }

      if (mode === 'signup' && !result.data.session){
        // Email confirmation is required by the Supabase project's auth
        // settings — no session yet, so don't redirect. setMode() resets
        // statusEl itself, so set this message after switching modes.
        setMode('login');
        statusEl.textContent = 'Account created — check your email to confirm, then log in.';
        return;
      }

      window.location.href = 'dashboard.html';
    });
  });

  document.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && (document.activeElement === emailEl || document.activeElement === passwordEl)){
      submitBtn.click();
    }
  });
</script>

</body>
</html>
