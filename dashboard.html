<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Play Together — Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --color-bg: #E7E7E7;
    --color-surface: #FFFFFF;
    --color-ink: #171717;
    --color-ink-soft: #6B6B6B;
    --color-placeholder: #A3A3A3;
    --color-border: #E5E5E5;
    --color-primary: #153320;
    --color-accent: #D6E84B;
    --color-accent-soft: #C9D8B8;

    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 20px;
    --space-6: 24px;
    --space-7: 28px;
    --space-8: 32px;

    --radius-sm: 10px;
    --radius-md: 16px;
    --radius-lg: 20px;
    --radius-pill: 999px;

    --font-sf: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;

    --fs-h1: 30px;
    --fs-h2: 15px;
    --fs-body: 15px;
    --fs-small: 13px;
    --fs-caption: 12px;

    --frame-min: 393px;
    --frame-max: 700px;

    --shadow-card: 0 1px 2px rgba(0,0,0,0.04);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    background: var(--color-bg);
    font-family: var(--font-body);
    color: var(--color-ink);
    -webkit-text-size-adjust: 100%;
    overflow-x: hidden;
    touch-action: pan-y;
  }

  body{
    display: flex;
    justify-content: center;
    min-width: var(--frame-min);
  }

  .frame{
    width: 100%;
    min-width: var(--frame-min);
    max-width: var(--frame-max);
    background: var(--color-bg);
    position: relative;
    min-height: 100vh;
    padding-bottom: var(--space-8);
  }

  .header{
    display: flex;
    align-items: center;
    gap: var(--space-3);
    padding: var(--space-8) var(--space-5) var(--space-2);
  }

  .logo-badge{
    width: 40px;
    height: 40px;
    border-radius: 6.4px;
    background: #E4FF3A;
    border: 0.4px solid #000000;
    color: #143622;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', var(--font-display);
    font-weight: 700;
    font-size: 25.6px;
    line-height: normal;
    flex-shrink: 0;
  }

  .brand-name{
    font-weight: 800;
    font-size: 18px;
    text-align: left;
    font-family: var(--font-display);
    flex: 1;
  }

  .logout-btn{
    border: none;
    background: none;
    color: var(--color-ink-soft);
    font-family: var(--font-body);
    font-size: var(--fs-small);
    cursor: pointer;
    padding: var(--space-2);
  }

  .hero{
    padding: var(--space-4) var(--space-5) 0;
  }

  .hero h1{
    font-family: var(--font-sf);
    font-weight: 700;
    font-size: 28px;
    line-height: 34px;
    letter-spacing: 0.38px;
    margin: 0;
  }

  .section{
    padding: var(--space-7) var(--space-5) 0;
  }

  .section-header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 0 0 var(--space-3);
  }

  .section-label{
    font-size: var(--fs-h2);
    font-weight: 700;
    margin: 0;
  }

  .add-btn{
    border: none;
    background: none;
    color: var(--color-primary);
    font-family: var(--font-body);
    font-size: var(--fs-small);
    font-weight: 700;
    cursor: pointer;
    padding: var(--space-1) var(--space-2);
  }

  .card{
    background: var(--color-surface);
    border-radius: 8px;
    box-shadow: var(--shadow-card);
    padding: 0;
  }

  .card.padded{ padding: var(--space-5); }

  .row-group > *:not(:last-child){
    border-bottom: 1px solid var(--color-border);
  }

  .row-group > *:first-child{
    border-top-left-radius: 8px;
    border-top-right-radius: 8px;
  }

  .row-group > *:last-child{
    border-bottom-left-radius: 8px;
    border-bottom-right-radius: 8px;
  }

  .row{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
    padding: var(--space-4);
    width: 100%;
    background: none;
    border: none;
    font-family: var(--font-body);
    text-align: left;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
  }

  .row-text{ min-width: 0; }
  .row-label{
    font-size: var(--fs-body);
    font-weight: 700;
    color: var(--color-ink);
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .row-sub{
    font-size: var(--fs-small);
    color: var(--color-ink-soft);
    margin-top: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .icon{
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    color: var(--color-placeholder);
  }

  .empty-state{
    padding: var(--space-6) var(--space-5);
    text-align: center;
    font-size: var(--fs-small);
    color: var(--color-ink-soft);
  }

  .primary-btn{
    width: 100%;
    padding: var(--space-4);
    border: none;
    border-radius: var(--radius-md);
    background: var(--color-primary);
    color: var(--color-accent);
    font-family: var(--font-display);
    font-size: var(--fs-body);
    font-weight: 700;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    text-align: center;
    text-decoration: none;
    display: block;
  }

  .primary-btn:active{ opacity: 0.9; }

  .inline-form{
    display: none;
    padding: var(--space-4);
    gap: var(--space-3);
    flex-direction: column;
  }

  .inline-form.open{ display: flex; }

  .field{
    width: 100%;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    background: transparent;
    outline: none;
    font-family: var(--font-body);
    font-size: max(16px, var(--fs-body));
    color: var(--color-ink);
    padding: var(--space-3) var(--space-4);
  }

  .field::placeholder{ color: var(--color-placeholder); }

  .inline-form-actions{
    display: flex;
    gap: var(--space-2);
  }

  .secondary-btn{
    flex: 1;
    padding: var(--space-3);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    background: none;
    color: var(--color-ink);
    font-family: var(--font-body);
    font-size: var(--fs-small);
    font-weight: 700;
    cursor: pointer;
  }

  .inline-form-actions .primary-btn{
    flex: 1;
    padding: var(--space-3);
    font-size: var(--fs-small);
  }

  .form-error{
    padding: 0 var(--space-1);
    font-size: var(--fs-caption);
    color: #C0392B;
    display: none;
  }
  .form-error.visible{ display: block; }

  .status-note{
    padding: var(--space-6) var(--space-5);
    text-align: center;
    font-size: var(--fs-small);
    color: var(--color-ink-soft);
  }

  button, .field{ min-height: 44px; }
</style>
</head>
<body>

<div class="frame" id="frame" style="display:none;">

  <header class="header">
    <div class="logo-badge">Pt</div>
    <span class="brand-name">Play Together</span>
    <button class="logout-btn" id="logout-btn" type="button">Log out</button>
  </header>

  <section class="hero">
    <h1>Your games</h1>
  </section>

  <section class="section">
    <div class="section-header">
      <h2 class="section-label">My Games</h2>
    </div>
    <div class="card row-group" id="games-card"></div>
    <a class="primary-btn" href="index.html" style="margin-top: var(--space-3);">+ Create game</a>
  </section>

  <section class="section">
    <div class="section-header">
      <h2 class="section-label">My Groups</h2>
      <button class="add-btn" id="show-group-form-btn" type="button">+ Add group</button>
    </div>
    <div class="card">
      <div class="inline-form" id="group-form">
        <input class="field" type="text" id="group-name-input" placeholder="Group name (e.g. Monday Night Gang)" />
        <p class="form-error" id="group-form-error"></p>
        <div class="inline-form-actions">
          <button class="secondary-btn" id="cancel-group-form-btn" type="button">Cancel</button>
          <button class="primary-btn" id="create-group-btn" type="button">Create</button>
        </div>
      </div>
      <div class="row-group" id="groups-list"></div>
    </div>
  </section>

</div>

<p class="status-note" id="loading-note">Loading…</p>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  // TODO: replace with your project's values — Supabase dashboard →
  // Project Settings → API.
  const SUPABASE_URL = 'https://egippcpanjtvpfkxefhy.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_cRGn5ZoheUHN3ZpqJ1e6dg_frds_duF';

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var frameEl = document.getElementById('frame');
  var loadingNoteEl = document.getElementById('loading-note');
  var gamesCardEl = document.getElementById('games-card');
  var groupsListEl = document.getElementById('groups-list');
  var logoutBtn = document.getElementById('logout-btn');

  var showGroupFormBtn = document.getElementById('show-group-form-btn');
  var cancelGroupFormBtn = document.getElementById('cancel-group-form-btn');
  var createGroupBtn = document.getElementById('create-group-btn');
  var groupFormEl = document.getElementById('group-form');
  var groupNameInput = document.getElementById('group-name-input');
  var groupFormErrorEl = document.getElementById('group-form-error');

  function escapeHtml(str){
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  (async function init(){
    var sessionResult = await supabase.auth.getSession();
    if (!sessionResult.data.session){
      window.location.href = 'login.html';
      return;
    }

    frameEl.style.display = '';
    loadingNoteEl.style.display = 'none';

    await Promise.all([loadGames(), loadGroups()]);
  })();

  async function loadGames(){
    var result = await supabase
      .from('games')
      .select('id, title, game_date, time_start, time_end, venue')
      .order('created_at', { ascending: false });

    if (result.error){
      gamesCardEl.innerHTML = '<p class="empty-state">Couldn\'t load games: ' + escapeHtml(result.error.message) + '</p>';
      return;
    }

    var games = result.data || [];
    if (games.length === 0){
      gamesCardEl.innerHTML = '<p class="empty-state">No games yet — create your first one below.</p>';
      return;
    }

    gamesCardEl.innerHTML = games.map(function(game){
      var subParts = [];
      if (game.game_date) subParts.push(game.game_date);
      if (game.time_start) subParts.push(game.time_start + (game.time_end ? ' - ' + game.time_end : ''));
      if (game.venue) subParts.push(game.venue);

      return '<a class="row" href="game-details.html?id=' + encodeURIComponent(game.id) + '">' +
        '<div class="row-text">' +
          '<span class="row-label">' + escapeHtml(game.title || 'Untitled game') + '</span>' +
          '<div class="row-sub">' + escapeHtml(subParts.join(' · ') || 'No details yet') + '</div>' +
        '</div>' +
        '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>' +
      '</a>';
    }).join('');
  }

  async function loadGroups(){
    var result = await supabase
      .from('groups')
      .select('id, name')
      .order('created_at', { ascending: false });

    if (result.error){
      groupsListEl.innerHTML = '<p class="empty-state">Couldn\'t load groups: ' + escapeHtml(result.error.message) + '</p>';
      return;
    }

    var groups = result.data || [];
    if (groups.length === 0){
      groupsListEl.innerHTML = '<p class="empty-state">No groups yet — add one to whitelist who can join your games.</p>';
      return;
    }

    groupsListEl.innerHTML = groups.map(function(group){
      return '<a class="row" href="groups.html?id=' + encodeURIComponent(group.id) + '">' +
        '<div class="row-text">' +
          '<span class="row-label">' + escapeHtml(group.name) + '</span>' +
        '</div>' +
        '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>' +
      '</a>';
    }).join('');
  }

  showGroupFormBtn.addEventListener('click', function(){
    groupFormEl.classList.add('open');
    groupNameInput.focus();
  });

  cancelGroupFormBtn.addEventListener('click', function(){
    groupFormEl.classList.remove('open');
    groupNameInput.value = '';
    groupFormErrorEl.classList.remove('visible');
  });

  createGroupBtn.addEventListener('click', async function(){
    var name = groupNameInput.value.trim();
    groupFormErrorEl.classList.remove('visible');

    if (!name){
      groupFormErrorEl.textContent = 'Please enter a group name.';
      groupFormErrorEl.classList.add('visible');
      return;
    }

    createGroupBtn.disabled = true;
    var userResult = await supabase.auth.getUser();
    var result = await supabase
      .from('groups')
      .insert({ name: name, host_id: userResult.data.user.id })
      .select()
      .single();
    createGroupBtn.disabled = false;

    if (result.error){
      groupFormErrorEl.textContent = result.error.message;
      groupFormErrorEl.classList.add('visible');
      return;
    }

    window.location.href = 'groups.html?id=' + encodeURIComponent(result.data.id);
  });

  logoutBtn.addEventListener('click', async function(){
    await supabase.auth.signOut();
    window.location.href = 'login.html';
  });
</script>

</body>
</html>
